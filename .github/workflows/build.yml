name: Build SynToolkit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish a GitHub Release
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.installer.outputs.name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw -LiteralPath SynToolkit\SynToolkit.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'The SynToolkit version could not be read from the project file.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: msbuild SynToolkit.sln /t:Restore /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Validate embedded SOS power plan
        shell: pwsh
        run: |
          $expected = '2FED233F4EC3D09E2D5E48E4AE04707296A29E7F9B93700F613D57D638D510F7'
          $actual = (Get-FileHash SynToolkit\Assets\PowerPlans\SOS.pow -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SOS.pow checksum mismatch: $actual" }

      - name: Run non-invasive service tests
        run: dotnet run --project SynToolkit.SystemInformationTests\SynToolkit.SystemInformationTests.csproj --configuration Release --no-restore

      - name: Publish SynToolkit
        run: msbuild SynToolkit\SynToolkit.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir="${{ github.workspace }}\artifacts\publish\"

      - name: Sync installer version
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = 'Installer\setup.iss'
          $text = Get-Content -Raw -LiteralPath $path
          $text = $text -replace '#define MyAppVersion "[^"\r\n]*"', "#define MyAppVersion `"$env:APP_VERSION`""
          if ($text -notmatch [regex]::Escape("#define MyAppVersion `"$env:APP_VERSION`"")) {
            throw 'Could not set MyAppVersion in Installer\setup.iss'
          }
          Set-Content -LiteralPath $path -Value $text

      - name: Compile setup wizard
        uses: robin24/inno-setup-action@v1
        with:
          filepath: Installer/setup.iss

      - name: Resolve installer
        id: installer
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -Path Installer\Output -Filter 'SynToolkit-Setup-*.exe' -File)
          if ($setups.Count -ne 1) {
            throw "Expected one installer in Installer\Output, found $($setups.Count)."
          }
          "name=$($setups[0].BaseName)" >> $env:GITHUB_OUTPUT
          "path=Installer/Output/$($setups[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.installer }}

      - name: Create checksums
        run: sha256sum *.exe > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists"
            exit 1
          fi

          gh release create "$VERSION" *.exe SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "SynToolkit $VERSION" \
            --generate-notes \
            --latest

          gh release view "$VERSION" --json body -q .body > release-body.md
          {
            echo
            echo "### SHA-256"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> release-body.md
          gh release edit "$VERSION" --notes-file release-body.md
